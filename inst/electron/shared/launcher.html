      var metricsMain = document.createElement('div');
      var metricsLabel = document.createElement('div');
      metricsLabel.className = 'settings-label'; metricsLabel.textContent = 'CPU / RAM in title bar';
      var metricsValue = document.createElement('div');
      metricsValue.className = 'settings-value'; metricsValue.textContent = 'Show system and app usage in the window title';
      metricsMain.appendChild(metricsLabel); metricsMain.appendChild(metricsValue);
      metricsRow.appendChild(metricsMain);
      var metricsBtn = makeButton(metricsOn ? 'On' : 'Off', metricsOn ? 'active' : '', function () {
        if (!window.lifecycle || !window.lifecycle.setMetricsOverlay) return;
        var next = !metricsOn;
        window.lifecycle.setMetricsOverlay(next).then(function (r) {
          metricsOn = !!(r && r.metricsOverlay);
          metricsBtn.textContent = metricsOn ? 'On' : 'Off';
          metricsBtn.classList.toggle('active', metricsOn);
        }).catch(function () { showToast('Could not change the title setting', 'error'); });
      });
      metricsRow.appendChild(metricsBtn);
      body.appendChild(metricsRow);

      if (s && s.trayEnabled) {
        var closeRow = document.createElement('div');
        closeRow.className = 'settings-row';
        var closeMain = document.createElement('div');
        var closeLabel = document.createElement('div');
        closeLabel.className = 'settings-label'; closeLabel.textContent = 'Launcher close button';
        var closeValue = document.createElement('div');
        closeValue.className = 'settings-value'; closeValue.textContent = 'Ask, minimize to tray, or quit';
        closeMain.appendChild(closeLabel); closeMain.appendChild(closeValue);
        closeRow.appendChild(closeMain);
        var closeSeg = document.createElement('div');
        closeSeg.className = 'segmented';
        var currentClose = (s.launcherCloseAction || '');
        [['', 'Ask'], ['tray', 'Tray'], ['quit', 'Quit']].forEach(function (pair) {
          var b = document.createElement('button');
          b.type = 'button';
          b.textContent = pair[1];
          b.className = pair[0] === currentClose ? 'active' : '';
          b.setAttribute('aria-pressed', pair[0] === currentClose ? 'true' : 'false');
          b.addEventListener('click', function () {
            if (!window.lifecycle || !window.lifecycle.setLauncherCloseAction) return;
            window.lifecycle.setLauncherCloseAction(pair[0]).then(function () {
              var siblings = closeSeg.querySelectorAll('button');
              for (var i = 0; i < siblings.length; i++) {
                siblings[i].classList.remove('active');
                siblings[i].setAttribute('aria-pressed', 'false');
              }
              b.classList.add('active');
              b.setAttribute('aria-pressed', 'true');
            }).catch(function () { showToast('Could not change the close behaviour', 'error'); });
          });
          closeSeg.appendChild(b);
        });
        closeRow.appendChild(closeSeg);
        body.appendChild(closeRow);
      }

      var crashOn = !!(s && s.crashReporting);
      var crashRow = document.createElement('div');
      crashRow.className = 'settings-row';
      var crashMain = document.createElement('div');
      var crashLabel = document.createElement('div');
      crashLabel.className = 'settings-label'; crashLabel.textContent = 'Save crash reports locally';
      var crashValue = document.createElement('div');
      crashValue.className = 'settings-value'; crashValue.textContent = 'Keep diagnostics on this computer for troubleshooting';
      crashMain.appendChild(crashLabel); crashMain.appendChild(crashValue);
      crashRow.appendChild(crashMain);
      var crashBtn = makeButton(crashOn ? 'On' : 'Off', crashOn ? 'active' : '', function () {
        if (!window.lifecycle || !window.lifecycle.setCrashReporting) return;
        var next = !crashOn;
        window.lifecycle.setCrashReporting(next).then(function (r) {
          crashOn = !!(r && r.crashReporting);
          crashBtn.textContent = crashOn ? 'On' : 'Off';
          crashBtn.classList.toggle('active', crashOn);
        }).catch(function () { showToast('Could not change crash reporting', 'error'); });
      });
      crashRow.appendChild(crashBtn);
      body.appendChild(crashRow);

      var installRow = document.createElement('div');
      installRow.className = 'settings-row';
      var installMain = document.createElement('div');
      var installLabel = document.createElement('div');
      installLabel.className = 'settings-label'; installLabel.textContent = 'Install a local package';
      var installValue = document.createElement('div');
      installValue.className = 'settings-value'; installValue.textContent = 'A .zip bundle from a developer or another store';
      installMain.appendChild(installLabel); installMain.appendChild(installValue);
      installRow.appendChild(installMain);
      var installActions = document.createElement('div');
      installActions.className = 'settings-actions';
      installActions.appendChild(makeButton('From file…', '', function () {
        closeConfirm();
        if (window.lifecycle && window.lifecycle.installFromFile) window.lifecycle.installFromFile();
      }));
      installActions.appendChild(makeButton('From URL…', '', function () {
        closeConfirm();
        openInstallUrlDialog();
      }));
      installRow.appendChild(installActions);
      body.appendChild(installRow);

      var dataRow = document.createElement('div');
      dataRow.className = 'settings-row';
      var dataMain = document.createElement('div');
      var dataLabel = document.createElement('div');
      dataLabel.className = 'settings-label'; dataLabel.textContent = 'Local data';
      var dataValue = document.createElement('div');
      dataValue.className = 'settings-value'; dataValue.textContent = 'Reset apps, packages and caches, or uninstall ShinyApps Store';
      dataMain.appendChild(dataLabel); dataMain.appendChild(dataValue);
      dataRow.appendChild(dataMain);
      var dataActions = document.createElement('div');
      dataActions.className = 'settings-actions';
      dataActions.appendChild(makeButton('Reset local data…', 'danger', function () {
        closeConfirm();
        if (window.lifecycle && window.lifecycle.resetLocalData) window.lifecycle.resetLocalData();
      }));
      dataActions.appendChild(makeButton('Uninstall ShinyApps…', 'danger', function () {
        closeConfirm();
        if (window.lifecycle && window.lifecycle.uninstallShell) window.lifecycle.uninstallShell();
      }));
      dataRow.appendChild(dataActions);
      body.appendChild(dataRow);
      dlg.appendChild(body);

      var note = document.createElement('div');
      note.className = 'settings-note';
      note.textContent = 'Updates are checked automatically on startup. Installed apps and shared R packages are verified by size and SHA-256.';
      dlg.appendChild(note);

      var actions = document.createElement('div');
      actions.className = 'dialog-actions';
      var closeBtn = makeButton('Close', 'primary', closeConfirm);
      actions.appendChild(closeBtn);
      dlg.appendChild(actions);

      overlay.hidden = false;
      setTimeout(function () { closeBtn.focus(); }, 0);
      document.addEventListener('keydown', confirmEsc);
      document.addEventListener('keydown', dialogTab);
    }

    // --- Busy / progress overlay (Reset, Clean up, ...) ---------------------
    function showBusyOverlay(title) {
      var t = document.getElementById('busy-title');
      if (t && title) t.textContent = title;
      var o = document.getElementById('busy-overlay');
      if (o) o.hidden = false;
      setBusyProgress(0, 0, 'Preparing\u2026');
    }
    function setBusyProgress(done, total, label) {
      var st = document.getElementById('busy-status');
      if (st && label) st.textContent = label;
      var wrap = document.getElementById('busy-progress');
      var bar = document.getElementById('busy-bar');
      if (!wrap || !bar) return;
      if (total && total > 0) {
        wrap.classList.remove('indeterminate');
        bar.style.width = Math.max(4, Math.round((done / total) * 100)) + '%';
      } else {
        wrap.classList.add('indeterminate');
      }
    }
    function hideBusyOverlay() {
      var o = document.getElementById('busy-overlay');
      if (o) o.hidden = true;
    }

    // --- Toasts -------------------------------------------------------------
    function showToast(message, type) {
      var host = document.getElementById('toasts');
      if (!host) return;
      var t = document.createElement('div');
      t.className = 'toast' + (type ? ' ' + type : '');
      t.textContent = message;
      host.appendChild(t);
      setTimeout(function () { t.classList.add('show'); }, 10);
      setTimeout(function () {
        t.classList.remove('show');
        setTimeout(function () { t.remove(); }, 250);
      }, 4000);
    }

    document.getElementById('overlay').addEventListener('click', function (ev) { if (ev.target === this) closeConfirm(); });
    (function () {
      var navBtns = document.querySelectorAll('#nav .nav-item');
      for (var i = 0; i < navBtns.length; i++) {
        (function (btn) {
          btn.addEventListener('click', function () { setSection(btn.getAttribute('data-section')); });
        })(navBtns[i]);
      }
    })();
    (function () {
      var btns = document.querySelectorAll('#layout-toggle button');
      for (var i = 0; i < btns.length; i++) {
        (function (btn) {
          btn.addEventListener('click', function () { setLayout(btn.getAttribute('data-layout')); });
        })(btns[i]);
      }
    })();
    document.getElementById('search').addEventListener('input', function () {
      query = this.value.trim();
      resetPaging();
      render();
    });
    document.getElementById('clear-filters').addEventListener('click', clearAllFilters);
    document.getElementById('sort-mode').addEventListener('change', function () {
      setSortMode(this.value);
    });
    document.getElementById('fav-toggle').addEventListener('click', function () {
      setFavOnly(!favOnly);
    });
    document.getElementById('update-all-btn').addEventListener('click', function () {
      var pending = updatesList();
      if (!pending.length) return;
      showConfirm({
        title: 'Update all?',
        message: 'Update ' + pending.length + ' app' + (pending.length === 1 ? '' : 's') +
          '? Running apps will be stopped first; downloads continue in the background.',
        confirmLabel: 'Update all',
        onConfirm: function () {
          pending.forEach(function (a) { window.lifecycle.updateApp(a.id); });
        }
      });
    });
    document.getElementById('load-more-btn').addEventListener('click', function () {
      visibleCount += pageSize();
      render();
    });
    document.getElementById('install-menu-btn').addEventListener('click', function () {
      openPopmenu(this, [
        { label: 'Install from file…', onClick: function () { if (window.lifecycle && window.lifecycle.installFromFile) window.lifecycle.installFromFile(); } },
        { label: 'Install from URL…', onClick: openInstallUrlDialog }
      ]);
    });
    document.getElementById('settings-btn').addEventListener('click', function () {
      openSettingsDialog().catch(function (e) { showToast('Could not open settings', 'error'); });
    });
    document.getElementById('running-pill').addEventListener('click', function () { setSection('running'); });
    window.addEventListener('dragover', function (ev) { ev.preventDefault(); });
    window.addEventListener('drop', function (ev) {
      ev.preventDefault();
      var f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
      if (!f || !window.lifecycle || !window.lifecycle.installFromFile) return;
      var p = window.lifecycle.getPathForFile ? window.lifecycle.getPathForFile(f) : f.path;
      if (p) window.lifecycle.installFromFile(p);
    });
    document.addEventListener('keydown', function (ev) {
      if ((ev.ctrlKey || ev.metaKey) && (ev.key === 'f' || ev.key === 'F' || ev.key === 'k' || ev.key === 'K')) {
        ev.preventDefault();
        var s = document.getElementById('search');
        if (s) { s.focus(); s.select(); }
      }
    });

    async function refresh(showFeedback) {
      if (!window.lifecycle || !window.lifecycle.listApps) { loading = false; render(); return; }
      loading = true;
      loadError = '';
      if (showFeedback) showToast('Refreshing catalog…');
      render();
      try {
        var res = await window.lifecycle.listApps();
        if (Array.isArray(res)) {
          model = res;
          offline = false;
        } else {
          model = (res && res.apps) || [];
          offline = !!(res && res.offline);
        }
        if (!Array.isArray(model)) model = [];
        byId = {};
        model.forEach(function (a) { byId[a.id] = a; });
        // Restore background task state so the Installing tab is accurate even
        // after a reload or a refresh triggered by another app finishing.
        var tasks = (res && !Array.isArray(res) && Array.isArray(res.tasks)) ? res.tasks : [];
        tasks.forEach(function (t) {
          var ta = byId[t.appId];
          if (!ta) return;
          ta.state = t.state;
          ta.taskId = t.taskId;
          ta.op = t.op;
          ta.percent = t.percent;
          ta.statusText = t.statusText;
          ta.step = t.step;
        });
        try { diskFree = await window.lifecycle.getDiskFree(); } catch (e) { diskFree = null; }
      } catch (e) {
        loadError = (e && e.message) || String(e) || 'unknown error';
        if (!Array.isArray(model)) model = [];
        if (showFeedback) showToast('Catalog refresh failed: ' + loadError, 'error');
      } finally {
        loading = false;
        if (!initialSectionApplied) {
          initialSectionApplied = true;
          if (!sectionTouched) section = installedList().length ? 'installed' : 'discover';
          else if (section === 'installed' && installedList().length === 0) section = 'discover';
        }
        render();
        pushQuickRunOrder();
        if (showFeedback && !loadError) {
          showToast(
            offline ? 'Catalog unavailable — showing cached apps' : 'Catalog refreshed',
            offline ? 'error' : 'success'
          );
        }
      }
    }

    if (window.lifecycle && window.lifecycle.onStoreCommand) {
      window.lifecycle.onStoreCommand(function (cmd) {
        if (!cmd) return;
        if (cmd.cmd === 'open_manager') {
          var aliases = { all: 'discover', installed: 'installed', installing: 'installing', updates: 'updates', running: 'running' };
          var target = aliases[cmd.tab] || 'installed';
          if (target === section) render(); else setSection(target);
        } else if (cmd.cmd === 'install_bundle') {
          if (window.lifecycle.installFromFile) window.lifecycle.installFromFile();
        } else if (cmd.cmd === 'install_url') {
          openInstallUrlDialog();
        } else if (cmd.cmd === 'catalog') {
          openCatalogDialog();
        } else if (cmd.cmd === 'mirror') {
          openMirrorDialog();
        } else if (cmd.cmd === 'storage') {
          openStorageDialog();
        } else if (cmd.cmd === 'data_root') {
          if (window.lifecycle.changeDataRoot) window.lifecycle.changeDataRoot();
        } else if (cmd.cmd === 'set_theme') {
          setTheme(cmd.theme === 'light' || cmd.theme === 'dark' ? cmd.theme : 'system');
        } else if (cmd.cmd === 'refresh') {
          refresh(true);
        } else if (cmd.cmd === 'usage_progress') {
          updateUsageProgress(cmd.done, cmd.total, cmd.label);
        } else if (cmd.cmd === 'busy_begin') {
          showBusyOverlay(cmd.title);
        } else if (cmd.cmd === 'busy_progress') {
          setBusyProgress(cmd.done, cmd.total, cmd.label);
        } else if (cmd.cmd === 'busy_done') {
          hideBusyOverlay();
        } else if (cmd.cmd === 'run' && cmd.appId && window.lifecycle.runApp) {
          window.lifecycle.runApp(cmd.appId);
        }
      });
    }

    // Progress ticks update only the affected card, so the grid no longer
    // rebuilds many times a second (which could swallow clicks on other cards).
    function appIdSelector(id) {
      // Catalog ids are not validated like bundle manifests are; escape them so
      // a stray quote or backslash cannot make querySelector throw.
      var v = String(id);
      if (window.CSS && typeof window.CSS.escape === 'function') v = window.CSS.escape(v);
      else v = v.replace(/["\\\]]/g, '\\$&');
      return '[data-app-id="' + v + '"]';
    }
    function updateCardProgress(app) {
      var el = document.querySelector(appIdSelector(app.id));
      if (!el) return;
      var bar = el.querySelector('.progress > i');
      if (bar) bar.style.width = (app.percent || 0) + '%';
      var st = el.querySelector('.status');
      if (st) st.textContent = app.step ? ((app.step === 'unpacking' && app.statusText) ? app.statusText : stepLabel(app.step, app.statusText)) : (opVerb(app.op) + '\u2026');
    }

    if (window.lifecycle && window.lifecycle.onStoreStatus) {
      window.lifecycle.onStoreStatus(function (ev) {
        if (ev.state === 'busy') {
          showToast(ev.message || 'Another operation is in progress; please wait.', 'error');
          return;
        }
        if (ev.id === '__bundle__') {
          if (ev.state === 'installing') { bundleBusy = true; bundleStatus = ev.statusText || ev.step || ''; if (typeof ev.percent === 'number') bundlePercent = ev.percent; render(); return; }
          bundleBusy = false;
          bundleStatus = '';
          bundlePercent = 0;
          if (ev.state === 'error' && ev.cancelled) {
            render();
            showToast('Bundle install cancelled');
          } else if (ev.state === 'error') {
            render();
            showToast(ev.message || ('Bundle install failed' + (ev.error ? ': ' + ev.error : '')), 'error');
          } else if (ev.state === 'cancelled') {
            render();
            showToast('Bundle install cancelled');
          } else {
            // A manual bundle install of the same app supersedes any error
            // left on its card by an earlier failed catalog install. Update
            // the card before rendering and refreshing, so the error is gone
            // even if the catalog refresh happens to fail.
            if (ev.appId) {
              delete errors[ev.appId];
              var bapp = byId[ev.appId];
              if (bapp) {
                bapp.installed = true;
                bapp.state = 'installed';
                if (ev.installedVersion) bapp.installedVersion = ev.installedVersion;
                bapp.updateAvailable = false;
              }
            }
            render();
            showToast(ev.message || 'Bundle installed', 'success');
          }
          refresh();
          return;
        }
        var app = byId[ev.id];
        var wasInstalling = !!(app && app.state === 'installing');
        if (ev.state === 'installing') delete errors[ev.id];
        if (ev.state === 'done') delete errors[ev.id];
        if (ev.state === 'error' && !ev.cancelled) errors[ev.id] = { step: ev.step || '', message: ev.error || 'install failed', op: ev.op || '' };
        if (app) {
          if (ev.taskId) app.taskId = ev.taskId;
          if (ev.state) app.state = ev.state;
          if (ev.op) app.op = ev.op;
          if (typeof ev.percent === 'number') app.percent = ev.percent;
          if (ev.statusText) app.statusText = ev.statusText;
          if (ev.step) app.step = ev.step;
          if (ev.error) app.error = ev.error;
          if (ev.installed !== undefined) app.installed = ev.installed;
          if (ev.installedVersion !== undefined) app.installedVersion = ev.installedVersion;
          if (ev.updateAvailable !== undefined) app.updateAvailable = ev.updateAvailable;
          if (ev.state === 'done') {
            if (ev.op === 'uninstall_app') {
              app.installed = false;
              app.updateAvailable = false;
            } else if (ev.op === 'install_app' || ev.op === 'update_app') {
              app.installed = true;
              if (app.catalogVersion) app.installedVersion = app.catalogVersion;
              app.updateAvailable = false;
            } else if (ev.op === 'run_app') {
              app.running = true;
            } else if (ev.op === 'stop_app') {
              app.running = false;
            }
            app.state = 'installed';
            app.percent = 0;
            delete app.taskId;
            delete app.op;
            delete app.step;
            delete app.statusText;
          }
          if (ev.state === 'installing' && wasInstalling) updateCardProgress(app);
          else render();
        }
        var nm = (app && app.name) || ev.id;
        if (ev.state === 'done' && ev.op) {
          var verb = ev.op === 'install_app' ? 'Installed ' : ev.op === 'update_app' ? 'Updated ' : ev.op === 'uninstall_app' ? 'Uninstalled ' : '';
          if (verb) showToast(verb + nm, 'success');
        }
        if (ev.state === 'error' && ev.cancelled) {
          showToast('Cancelled ' + nm, 'success');
        } else if (ev.state === 'error') {
          showToast('Failed to ' + opAction(ev.op) + ' ' + nm + (ev.step ? ' (' + ev.step + ')' : ''), 'error');
        }
        if ((ev.state === 'done' && ev.op) || ev.state === 'error') refresh();
      });
    }

    // Retry automatically when the connection returns.
    window.addEventListener('online', function () { refresh(); });

    refresh();
  </script>
</body>
