<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' https: data:">
  <title>{{app_name}}</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: {{brand_background}};
      --surface: color-mix(in srgb, var(--canvas) 35%, #ffffff 65%);
      --surface-2: color-mix(in srgb, var(--canvas) 62%, #ffffff 38%);
      --sidebar: color-mix(in srgb, var(--canvas) 86%, #191b1c 14%);
      --ink: #191b1c;
      --ink-2: #3d3f40;
      --muted: #5f5c56;
      --line: color-mix(in srgb, var(--ink) 13%, transparent);
      --line-strong: color-mix(in srgb, var(--ink) 23%, transparent);
      --accent: {{brand_primary}};
      --accent-ink: #ffffff;
      --accent-soft: color-mix(in srgb, var(--accent) 13%, var(--surface));
      --ok: #1c7147;
      --ok-soft: color-mix(in srgb, var(--ok) 12%, var(--surface));
      --warn: #8a5300;
      --warn-soft: color-mix(in srgb, var(--warn) 14%, var(--surface));
      --danger: #b42318;
      --danger-soft: color-mix(in srgb, var(--danger) 12%, var(--surface));
      --focus: color-mix(in srgb, var(--accent) 55%, transparent);
      --font-ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      --font-mono: "Cascadia Code", "SFMono-Regular", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
      --text-xs: 12px;
      --text-sm: 13px;
      --text-ui: 13.5px;
      --text-md: 15px;
      --text-lg: 19px;
      --text-xl: 23px;
      --r-sm: 7px;
      --r-md: 10px;
      --r-lg: 14px;
      --shadow-1: 0 1px 2px rgba(25, 27, 28, .05);
      --shadow-2: 0 14px 34px -22px rgba(25, 27, 28, .38);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --canvas: #151617;
      --surface: #1c1e1f;
      --surface-2: #222526;
      --sidebar: #191b1c;
      --ink: #f1eee7;
      --ink-2: #cfcbc2;
      --muted: #a6a198;
      --line: color-mix(in srgb, var(--ink) 14%, transparent);
      --line-strong: color-mix(in srgb, var(--ink) 26%, transparent);
      --accent: color-mix(in srgb, {{brand_primary}} 58%, #ffffff);
      --accent-ink: #101214;
      --accent-soft: color-mix(in srgb, var(--accent) 17%, var(--surface));
      --ok: #6fd39b;
      --ok-soft: color-mix(in srgb, var(--ok) 14%, var(--surface));
      --warn: #f0bd6b;
      --warn-soft: color-mix(in srgb, var(--warn) 14%, var(--surface));
      --danger: #ff9a91;
      --danger-soft: color-mix(in srgb, var(--danger) 14%, var(--surface));
      --focus: color-mix(in srgb, var(--accent) 65%, transparent);
      --shadow-1: 0 1px 2px rgba(0, 0, 0, .28);
      --shadow-2: 0 18px 40px -24px rgba(0, 0, 0, .7);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-ui);
      font-size: var(--text-ui);
      line-height: 1.45;
      background: var(--canvas);
      color: var(--ink);
      min-height: 100vh;
      text-rendering: optimizeLegibility;
    }
    ::selection { background: var(--accent-soft); color: var(--ink); }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    ::-webkit-scrollbar { width: 11px; height: 11px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--ink) 18%, transparent);
      border: 3px solid var(--canvas);
      border-radius: 99px;
    }
    ::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--ink) 30%, transparent); }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }

    /* Shell */
    .app-shell { display: grid; grid-template-columns: 234px minmax(0, 1fr); min-height: 100vh; }
    .sidebar {
      position: sticky; top: 0; height: 100vh; overflow: auto;
      display: flex; flex-direction: column; gap: 22px;
      padding: 20px 14px 14px;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 0; min-width: 0; }
    .brand-mark {
      flex: 0 0 auto; width: 30px; height: 30px; display: grid; place-items: center;
      color: var(--accent); background: var(--surface);
      border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow-1);
    }
    .brand-mark svg { width: 17px; height: 17px; }
    .brand-name { font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-name em { font-style: normal; font-weight: 500; color: var(--muted); }
    .nav { display: flex; flex-direction: column; gap: 2px; }
    .nav-item {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      width: 100%; padding: 8px 10px; border: 0; border-radius: 8px;
      background: transparent; color: var(--ink-2); font-size: var(--text-ui); font-weight: 520;
      text-align: left; transition: background .12s ease, color .12s ease;
    }
    .nav-item:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); color: var(--ink); }
    .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 620; }
    .nav-count {
      font-family: var(--font-mono); font-size: 11px; font-variant-numeric: tabular-nums;
      color: var(--muted); background: color-mix(in srgb, var(--ink) 7%, transparent);
      padding: 1px 6px; border-radius: 99px; line-height: 1.5;
    }
    .nav-item.active .nav-count { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .side-tags { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
    .side-heading { font-size: var(--text-sm); font-weight: 620; color: var(--muted); padding: 0 10px; }
    .tag-list { display: flex; flex-direction: column; gap: 1px; overflow: auto; max-height: 32vh; }
    .tag-btn {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      width: 100%; padding: 6px 10px; border: 0; border-radius: 7px;
      background: transparent; color: var(--ink-2); font-size: var(--text-sm); text-align: left;
    }
    .tag-btn:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); color: var(--ink); }
    .tag-btn.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .tag-btn .tag-count { font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .tag-empty { padding: 4px 10px; font-size: var(--text-xs); color: var(--muted); }
    .sidebar-footer { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 2px; }

    .main { min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      position: sticky; top: 0; z-index: 20;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 18px;
      padding: 18px 28px 14px;
      background: var(--canvas);
      border-bottom: 1px solid var(--line);
    }
    .page-heading { min-width: 0; }
    .page-heading h1 { font-size: var(--text-xl); font-weight: 650; letter-spacing: -.02em; line-height: 1.15; }
    .page-heading p { margin-top: 3px; font-size: var(--text-sm); color: var(--muted); }
    .topbar-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .search-wrap { position: relative; display: flex; align-items: center; }
    .search-wrap svg { position: absolute; left: 10px; width: 15px; height: 15px; color: var(--muted); pointer-events: none; }
    .search {
      width: min(330px, 34vw); height: 34px; padding: 0 12px 0 32px;
      border: 1px solid var(--line-strong); border-radius: var(--r-sm);
      background: var(--surface); color: var(--ink); font-size: var(--text-ui);
    }
    .search::placeholder { color: var(--muted); }
    .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); outline: none; }
    .tag-select {
      font-size: var(--text-sm); padding: 5px 9px;
      border: 1px solid var(--line-strong); border-radius: var(--r-sm);
      background: var(--surface); color: var(--ink);
    }
    .tag-select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
    .segmented { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-sm); overflow: hidden; background: var(--surface); }
    .segmented button { font-size: var(--text-xs); padding: 6px 10px; border: 0; background: transparent; color: var(--muted); }
    .segmented button + button { border-left: 1px solid var(--line); }
    .segmented button:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); color: var(--ink); }
    .segmented button.active { background: var(--accent-soft); color: var(--accent); font-weight: 620; }
    .running-pill {
      display: inline-flex; align-items: center; gap: 7px; max-width: 220px; height: 34px;
      padding: 0 11px; border: 1px solid color-mix(in srgb, var(--accent) 34%, var(--line));
      border-radius: 99px; background: var(--accent-soft); color: var(--accent);
      font-size: var(--text-xs); font-weight: 620;
    }
    .running-pill:hover { border-color: var(--accent); }
    .running-pill .dot { flex: 0 0 auto; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent); }
    .running-pill .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 12px 28px 0; }
    .toolbar-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .result-count { font-size: var(--text-xs); color: var(--muted); white-space: nowrap; }
    .content { width: 100%; max-width: 1600px; margin: 0 auto; padding: 14px 28px 48px; }

    .banner, .busybar {
      display: flex; align-items: center; gap: 10px;
      border: 1px solid transparent; border-radius: var(--r-md);
      padding: 9px 12px; font-size: var(--text-sm); margin-bottom: 12px;
    }
    .banner { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 24%, var(--line)); color: var(--warn); }
    .banner .btn { margin-left: auto; }
    .busybar { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 24%, var(--line)); color: var(--accent); }
    .busybar .progress { flex: 0 0 160px; margin-top: 0; }

    /* Buttons */
    .btn {
      min-height: 30px; padding: 5px 11px; border-radius: var(--r-sm);
      border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
      font-size: var(--text-sm); font-weight: 550;
      transition: background .12s ease, border-color .12s ease, color .12s ease, transform .12s ease;
    }
    .btn:hover { background: var(--surface-2); border-color: color-mix(in srgb, var(--ink) 30%, transparent); }
    .btn:active { transform: translateY(.5px); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); border-color: color-mix(in srgb, var(--accent) 88%, #000); }
    .btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 36%, var(--line)); background: var(--surface); }
    .btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); }
    .btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
    .btn.ghost:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); color: var(--ink); }
    .btn.active { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); color: var(--accent); }
    .btn.icon, .btn.icon-link { display: inline-flex; align-items: center; justify-content: center; }
    .btn.icon { padding: 5px 8px; font-weight: 650; }
    .btn:disabled { opacity: .45; cursor: default; transform: none; }
    .link-btn {
      background: none; border: none; color: var(--accent); cursor: pointer;
      font: inherit; font-size: var(--text-xs); text-decoration: underline; text-underline-offset: 2px; padding: 0;
    }

    /* Catalog layout */
    .apps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .apps-grid.list-view { display: flex; flex-direction: column; gap: 6px; }
    .app-card {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
      padding: 18px; display: flex; flex-direction: column; box-shadow: var(--shadow-1);
      transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    }
    .app-card:hover { border-color: var(--line-strong); box-shadow: var(--shadow-2); transform: translateY(-1px); }
    .app-icon {
      width: 56px; height: 56px; border-radius: 12px; margin-bottom: 12px;
      background: var(--accent-soft); color: var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 16%, var(--line));
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 700;
    }
    .app-icon.sm { width: 38px; height: 38px; font-size: 16px; border-radius: 9px; margin-bottom: 0; }
    .app-icon.plain { background: transparent; border-color: transparent; }
    :root[data-theme="dark"] .app-icon.plain { background: #242728; border-color: var(--line); }
    .app-icon img { width: 100%; height: 100%; object-fit: contain; border-radius: 10px; }
    .app-title-row { display: flex; align-items: center; gap: 6px; min-width: 0; margin-bottom: 4px; }
    .app-title-row .app-name { min-width: 0; margin-bottom: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .app-name { font-size: var(--text-md); font-weight: 650; letter-spacing: -.01em; line-height: 1.25; }
    .app-name.link { color: var(--accent); cursor: pointer; position: relative; align-self: flex-start; }
    .app-name.link:hover { text-decoration: underline; text-underline-offset: 2px; }
    .app-name.link[data-tip]:hover::after {
      content: attr(data-tip); position: absolute; left: 0; top: 100%; margin-top: 4px; z-index: 10;
      background: var(--ink); color: var(--canvas); font-size: 11px; font-weight: 450; text-decoration: none;
      padding: 3px 7px; border-radius: 5px; white-space: nowrap;
    }
    .app-desc {
      margin-top: 4px; font-size: var(--text-sm); color: var(--muted); line-height: 1.45;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .app-meta {
      margin-top: 7px; font-family: var(--font-mono); font-size: var(--text-xs);
      color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tag-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .tag-chip {
      font-size: 11.5px; line-height: 1.4; padding: 1px 7px; border-radius: 99px;
      border: 1px solid transparent; background: color-mix(in srgb, var(--ink) 6%, transparent);
      color: var(--muted); transition: background .12s ease, color .12s ease;
    }
    .tag-chip:hover { background: var(--accent-soft); color: var(--accent); }
    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px;
      margin-top: 9px; align-self: flex-start; white-space: nowrap;
      background: var(--surface-2); color: var(--muted);
    }
    .pill.installed { background: var(--ok-soft); color: var(--ok); }
    .pill.update { background: var(--warn-soft); color: var(--warn); }
    .pill.notinstalled, .pill.unavailable { background: var(--surface-2); color: var(--muted); }
    .pill.running, .pill.busy { background: var(--accent-soft); color: var(--accent); }
    .pill.incompatible { background: var(--danger-soft); color: var(--danger); }
    .pill.local { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
    .progress { height: 5px; background: var(--surface-2); border-radius: 99px; margin-top: 10px; overflow: hidden; }
    .progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s ease; }
    .status { font-size: var(--text-xs); color: var(--muted); margin-top: 6px; }
    .status.error { color: var(--danger); }
    .card-actions { display: flex; gap: 6px; margin-top: auto; padding-top: 12px; flex-wrap: wrap; }
    .app-title-row .icon-link { padding: 2px 7px; font-size: 12px; line-height: 1.2; }

    .apps-grid.list-view .app-row {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) 128px 112px 78px auto;
      align-items: center; gap: 12px;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
      padding: 9px 14px; transition: border-color .12s ease, background .12s ease;
    }
    .app-row:hover { border-color: var(--line-strong); background: var(--surface-2); }
    .app-row .app-icon.sm { flex: 0 0 auto; }
    .app-row-main { min-width: 0; }
    .app-row-main .app-name { margin-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .app-row-main .app-desc { -webkit-line-clamp: 1; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .app-row-main .progress { margin-top: 6px; }
    .app-row-main .status { margin-top: 3px; }
    .row-cell {
      min-width: 0; font-family: var(--font-mono); font-size: 12px;
      color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row-status .pill { margin-top: 0; }
    .row-status .pill.local { margin-top: 4px; display: block; width: fit-content; }
    .app-row .card-actions { margin: 0; padding: 0; flex: 0 0 auto; justify-self: end; }
    .list-header {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) 128px 112px 78px auto;
      align-items: center; gap: 12px;
      padding: 0 14px 4px; font-size: 11px; text-transform: uppercase;
      letter-spacing: .05em; color: var(--muted);
    }
    .list-header .h-actions { text-align: right; }
    .empty { margin: 72px auto; max-width: 460px; text-align: center; color: var(--muted); font-size: var(--text-ui); line-height: 1.55; }
    .empty .btn { margin-top: 16px; }
    .empty .status { color: var(--muted); }

    .load-more-wrap { display: flex; justify-content: center; margin-top: 18px; }

    /* App detail drawer */
    .drawer-overlay {
      position: fixed; inset: 0; z-index: 1050;
      display: flex; justify-content: flex-end;
      background: color-mix(in srgb, #0d0e0e 45%, transparent);
    }
    .drawer {
      width: min(440px, 92vw); height: 100%;
      background: var(--surface); border-left: 1px solid var(--line-strong);
      box-shadow: var(--shadow-2); padding: 22px; overflow: auto;
      animation: drawer-in .18s ease-out;
    }
    @keyframes drawer-in { from { transform: translateX(16px); opacity: 0; } to { transform: none; opacity: 1; } }
    .drawer-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
    .drawer-head .app-icon { margin: 0; flex: 0 0 auto; }
    .drawer-head-main { flex: 1 1 auto; min-width: 0; }
    .drawer-title { font-size: var(--text-lg); font-weight: 650; letter-spacing: -.02em; overflow-wrap: anywhere; }
    .drawer-sub { margin-top: 3px; font-size: var(--text-sm); color: var(--muted); }
    .drawer-close { flex: 0 0 auto; }
    .drawer-desc { margin: 4px 0 12px; font-size: var(--text-sm); color: var(--ink-2); line-height: 1.6; white-space: pre-wrap; }
    .drawer-meta { display: grid; grid-template-columns: 104px 1fr; gap: 5px 12px; margin: 14px 0; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: var(--text-xs); }
    .drawer-meta dt { color: var(--muted); }
    .drawer-meta dd { margin: 0; color: var(--ink-2); font-family: var(--font-mono); overflow-wrap: anywhere; }
    .drawer-section { margin-top: 16px; }
    .drawer-section-title { margin-bottom: 7px; font-size: var(--text-sm); font-weight: 620; color: var(--muted); }
    .drawer-links, .drawer-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .drawer .tag-chips { margin-top: 0; }
    .drawer .card-actions { margin-top: 0; padding-top: 0; }
    .app-name[role="button"] { cursor: pointer; }
    .app-name[role="button"]:hover { color: var(--accent); }

    /* Skeletons */
    .sk { background: linear-gradient(90deg, var(--surface-2) 25%, var(--line) 37%, var(--surface-2) 63%); background-size: 400% 100%; animation: shimmer 1.4s infinite; border-radius: 6px; }
    @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
    .sk-icon { width: 56px; height: 56px; border-radius: 12px; margin-bottom: 12px; }
    .sk-icon.sm { width: 38px; height: 38px; border-radius: 9px; margin: 0; }
    .sk-line { height: 9px; margin: 8px 0; }
    .w40 { width: 40%; } .w60 { width: 60%; } .w70 { width: 70%; } .w80 { width: 80%; }

    /* Overflow menu */
    .popmenu {
      position: fixed; z-index: 1300; min-width: 180px; padding: 6px;
      background: var(--surface); border: 1px solid var(--line-strong);
      border-radius: var(--r-md); box-shadow: var(--shadow-2);
      animation: menu-in .12s ease-out;
    }
    @keyframes menu-in { from { opacity: 0; transform: translateY(-3px) scale(.99); } to { opacity: 1; transform: none; } }
    .popmenu-item {
      display: block; width: 100%; text-align: left; border: 0; border-radius: 6px;
      background: none; padding: 7px 10px; font-size: var(--text-sm); color: var(--ink);
    }

    /* Dialogs */
    .overlay { position: fixed; inset: 0; z-index: 1100; display: flex; align-items: center; justify-content: center; padding: 24px; background: color-mix(in srgb, #0d0e0e 55%, transparent); }

    .settings-label { font-size: var(--text-sm); font-weight: 620; }
    .settings-value { margin-top: 2px; max-width: 360px; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted); word-break: break-all; }
    .settings-note { margin-top: 16px; font-size: var(--text-xs); color: var(--muted); line-height: 1.55; }
    .settings-actions { display: flex; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }
    .settings-group { margin-top: 18px; }
    .settings-group h3 { margin-bottom: 6px; font-size: var(--text-sm); font-weight: 620; color: var(--muted); }

    /* Toasts */
    .toasts { position: fixed; right: 20px; bottom: 20px; z-index: 1200; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      max-width: 340px; padding: 9px 13px; border-radius: var(--r-sm);
      background: var(--ink); color: var(--canvas); font-size: var(--text-sm);

    /* Storage */
    .storage-dialog { width: min(560px, 92vw); max-height: 80vh; overflow: auto; }
    .storage-dialog .dialog-actions { margin-top: 16px; flex-wrap: wrap; }
    .storage-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; font-size: var(--text-sm); border-bottom: 1px solid var(--line); }
    .storage-row .storage-muted { color: var(--muted); }
    .storage-section { margin: 14px 0 2px; font-size: var(--text-sm); font-weight: 620; }
    .storage-path { padding: 4px 0; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted); word-break: break-all; }
    .settings-dialog .search { display: block; width: 100%; margin: 6px 0 10px; padding-left: 12px; }

    .fav-btn.on { color: var(--warn); }

    /* Responsive shell */
    @media (max-width: 1080px) {
      .app-shell { grid-template-columns: 208px minmax(0, 1fr); }

    @media (max-width: 860px) {

      .sidebar-footer { margin: 0 0 0 auto; grid-template-columns: auto auto; }
      .topbar { position: static; flex-wrap: wrap; align-items: flex-start; padding: 16px 18px 12px; }
      .topbar-actions { width: 100%; justify-content: flex-start; }
      .search { flex: 1; width: auto; }
      .toolbar, .content { padding-left: 18px; padding-right: 18px; }
      .apps-grid.list-view .app-row { grid-template-columns: 38px minmax(0, 1fr) 120px auto; }

  <script>

<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Store navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">

            <rect x="3.5" y="14" width="7" height="7" rx="2" fill="currentColor" opacity=".45"/>

    </aside>

    <main class="main">
      <header class="topbar">
        <div class="page-heading">

        </div>
        <div class="topbar-actions">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7"/>

      <div class="content">

  </div>

  <div class="drawer-overlay" id="drawer-overlay" hidden>
    <aside class="drawer" id="app-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"></aside>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div class="overlay" id="overlay" hidden><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>

  <div class="overlay" id="busy-overlay" hidden>
    <div class="dialog busy-dialog" role="dialog" aria-modal="true" aria-labelledby="busy-title">
      <div class="dialog-title" id="busy-title">Working&#8230;</div>

  <script>
    var model = [];
    var byId = {};
    var errors = {};
    var section = 'discover';   // 'discover' | 'installed' | 'updates' | 'running' | 'installing'
    var sectionTouched = false;
    var initialSectionApplied = false;
    var visibleCount = 0;
    var drawerAppId = null;
    var drawerLastFocus = null;
    try {
      var savedSection = localStorage.getItem('shinyapps.section');
      if (savedSection === 'discover' || savedSection === 'installed') {
        section = savedSection;
        sectionTouched = true;
      }
    } catch (e) {}
    var query = '';
    var selectedTag = '';
    var layout = 'list';      // 'card' | 'list'
    var loading = false;
    var loadError = '';
    var offline = false;
    var diskFree = null;
    try {
      var savedLayout = localStorage.getItem('shinyapps.layout');
      if (savedLayout === 'card' || savedLayout === 'list') layout = savedLayout;
    } catch (e) {}

    // Favorites / recently used / sort (persisted; purely client-side).
    var favorites = [];
    var recent = [];
    var usage = {};           // { appId: runCount }
    var sortMode = 'name';    // 'name' | 'recent' | 'used'
    var favOnly = false;
    try {
      favorites = JSON.parse(localStorage.getItem('shinyapps.favorites') || '[]');
      recent = JSON.parse(localStorage.getItem('shinyapps.recent') || '[]');
      usage = JSON.parse(localStorage.getItem('shinyapps.usage') || '{}');
      var savedSort = localStorage.getItem('shinyapps.sort');
      if (savedSort === 'name' || savedSort === 'recent' || savedSort === 'used') sortMode = savedSort;
    } catch (e) {}
    if (!Array.isArray(favorites)) favorites = [];
    if (!Array.isArray(recent)) recent = [];
    if (!usage || typeof usage !== 'object') usage = {};

    // Theme: System / Light / Dark (persisted; applied via <html data-theme>).
    function applyTheme() {
      var t = 'system';
      try { t = localStorage.getItem('shinyapps.theme') || 'system'; } catch (e) {}
      var eff = (t === 'system')
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : t;
      document.documentElement.setAttribute('data-theme', eff === 'dark' ? 'dark' : 'light');
      if (window.lifecycle && window.lifecycle.notifyTheme) window.lifecycle.notifyTheme(t);
    }
    function setTheme(mode) {
      try { localStorage.setItem('shinyapps.theme', mode); } catch (e) {}
      applyTheme();
    }
    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { applyTheme(); });
    } catch (e) {}
    applyTheme();
    function isFav(id) { return favorites.indexOf(id) !== -1; }
    function saveFavs() { try { localStorage.setItem('shinyapps.favorites', JSON.stringify(favorites)); } catch (e) {} }
    function saveRecent() { try { localStorage.setItem('shinyapps.recent', JSON.stringify(recent)); } catch (e) {} }
    function toggleFav(id) {
      var i = favorites.indexOf(id);
      if (i === -1) favorites.push(id); else favorites.splice(i, 1);
      saveFavs(); render();
      pushQuickRunOrder();
    }
    function bumpUsage(id) {
      usage[id] = (usage[id] || 0) + 1;
      try { localStorage.setItem('shinyapps.usage', JSON.stringify(usage)); } catch (e) {}
    }
    function markRecent(id) {
      var i = recent.indexOf(id);
      if (i !== -1) recent.splice(i, 1);
      recent.unshift(id);
      if (recent.length > 20) recent.length = 20;
      saveRecent();
      bumpUsage(id);
      pushQuickRunOrder();
    }
    // Push the Quick Run ordering (favorites -> usage -> recent -> name) to the
    // main process, which builds the native Apps > Quick Run menu.
    function pushQuickRunOrder() {
      if (!window.lifecycle || !window.lifecycle.setQuickRunOrder) return;
      var installed = model.filter(function (a) { return a.installed; });
      var ordered = installed.slice().sort(function (a, b) {
        var fa = isFav(a.id) ? 1 : 0, fb = isFav(b.id) ? 1 : 0;
        if (fa !== fb) return fb - fa;
        var ua = usage[a.id] || 0, ub = usage[b.id] || 0;
        if (ua !== ub) return ub - ua;
        var ra = recent.indexOf(a.id), rb = recent.indexOf(b.id);
        if (ra === -1 && rb === -1) return String(a.name || a.id).localeCompare(String(b.name || b.id));
        if (ra === -1) return 1;
        if (rb === -1) return -1;
        return ra - rb;
      });
      window.lifecycle.setQuickRunOrder({ order: ordered.map(function (a) { return a.id; }), favorites: favorites.slice() });
    }
    function setSortMode(m) {
      if (m !== 'name' && m !== 'recent' && m !== 'used') return;
      sortMode = m;
      try { localStorage.setItem('shinyapps.sort', sortMode); } catch (e) {}
      resetPaging();
      render();
    }
    function setFavOnly(on) { favOnly = !!on; resetPaging(); render(); }

    var STEP_LABELS = {
      resolve: 'Resolving bundle',
      download: 'Downloading',
      verifying: 'Verifying download',
      unpacking: 'Unpacking',
      linking: 'Linking packages'
    };
    function stepLabel(step, fallback) {
      return STEP_LABELS[step] || fallback || 'Installing\u2026';
    }
    function opVerb(op) {
      if (op === 'update_app') return 'Updating';
      if (op === 'uninstall_app') return 'Uninstalling';
      if (op === 'install_app' || op === 'install_bundle') return 'Installing';
      return 'Working on';
    }
    function opAction(op) {
      if (op === 'update_app') return 'update';
      if (op === 'uninstall_app') return 'uninstall';
      if (op === 'install_app') return 'install';
      if (op === 'run_app') return 'start';
      if (op === 'stop_app') return 'stop';
      return 'complete';
    }

    function makeButton(label, cls, onClick, disabled) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn' + (cls ? ' ' + cls : '');
      b.textContent = label;
      b.disabled = !!disabled;
      b.addEventListener('click', function (ev) { ev.stopPropagation(); onClick(); });
      return b;
    }

    function installedList() { return model.filter(function (a) { return a.installed; }); }
    function installingList() { return model.filter(function (a) { return a.state === 'installing' || a.state === 'queued'; }); }
    function updatesList() { return model.filter(function (a) { return a.installed && a.updateAvailable; }); }
    function runningList() { return model.filter(function (a) { return a.running; }); }
    var bundleBusy = false;
    var bundleStatus = '';
    var bundlePercent = 0;

    function sortByName(list) {
      return list.slice().sort(function (a, b) {
        return String(a.name || a.id).localeCompare(String(b.name || b.id));
      });
    }

    function sortList(list) {
      var out = sortByName(list);
      if (sortMode === 'recent') {
        return out.slice().sort(function (a, b) {
          var ia = recent.indexOf(a.id), ib = recent.indexOf(b.id);
          if (ia === -1 && ib === -1) return String(a.name || a.id).localeCompare(String(b.name || b.id));
          if (ia === -1) return 1;
          if (ib === -1) return -1;
          return ia - ib;
        });
      }
      if (sortMode === 'used') {
        return out.slice().sort(function (a, b) {
          var ua = usage[a.id] || 0, ub = usage[b.id] || 0;
          if (ua !== ub) return ub - ua;
          return String(a.name || a.id).localeCompare(String(b.name || b.id));
        });
      }
      return out;
    }

    function matchesFilters(app) {
      if (selectedTag && (app.tags || []).indexOf(selectedTag) === -1) return false;
      if (!query) return true;
      var q = query.toLowerCase();
      return [app.name, app.id, app.description, app.author].some(function (v) {
        return v && String(v).toLowerCase().indexOf(q) !== -1;
      });
    }

    var SECTION_META = {
      discover: { title: 'Discover', subtitle: 'Browse the catalog and install Shiny apps.' },
      installed: { title: 'My Apps', subtitle: 'Installed on this computer.' },
      updates: { title: 'Updates', subtitle: 'New versions available for installed apps.' },
      running: { title: 'Running', subtitle: 'Only one app runs at a time.' },
      installing: { title: 'Installing', subtitle: 'Downloads and installs in progress.' }
    };

    function currentList() {
      var base;
      // The top-bar search is global: it searches the whole catalog regardless
      // of the section currently selected.
      if (query) base = model.slice();
      else if (section === 'installed') base = installedList();
      else if (section === 'installing') base = installingList();
      else if (section === 'updates') base = updatesList();
      else if (section === 'running') base = runningList();
      else base = model.slice();
      if (favOnly) base = base.filter(function (a) { return isFav(a.id); });
      return sortList(base.filter(matchesFilters));
    }

    function emptyMessage() {
      if (query || selectedTag || favOnly) return 'No apps match these filters.';
      if (section === 'installing') return 'No installs in progress. Downloads continue in the background while you browse.';
      if (section === 'updates') return 'Everything is up to date.';
      if (section === 'running') return 'No apps are running. Start one from My Apps or Discover.';
      if (section === 'installed') return 'No apps installed yet. Browse Discover to install your first app.';
      return 'No apps in the catalog yet.';
    }

    function countFor(t) {
      if (t === 'discover') return model.length;
      if (t === 'installed') return installedList().length;
      if (t === 'installing') return installingList().length;
      if (t === 'updates') return updatesList().length;
      if (t === 'running') return runningList().length;
      return model.length;
    }

    function updateChrome() {
      var meta = SECTION_META[section] || SECTION_META.discover;
      var searching = !!query;
      var titleEl = document.getElementById('page-title');
      var subtitleEl = document.getElementById('page-subtitle');
      if (titleEl) titleEl.textContent = searching ? 'Search results' : meta.title;
      if (subtitleEl) {
        if (searching) {
          var matches = currentList().length;
          subtitleEl.textContent = matches + (matches === 1 ? ' app matches ' : ' apps match ') + '“' + query + '”';
        } else {
          subtitleEl.textContent = meta.subtitle;
        }
      }

      var navItems = document.querySelectorAll('#nav .nav-item');
      for (var i = 0; i < navItems.length; i++) {
        // While searching, no section owns the results: the whole catalog is
        // being searched.
        var active = !searching && navItems[i].getAttribute('data-section') === section;
        navItems[i].classList.toggle('active', active);
        if (active) navItems[i].setAttribute('aria-current', 'page');
        else navItems[i].removeAttribute('aria-current');
      }

      var counts = {
        discover: countFor('discover'),
        installed: countFor('installed'),
        updates: countFor('updates'),
        running: countFor('running'),
        installing: countFor('installing')
      };
      var countEls = document.querySelectorAll('#nav .nav-count');
      for (var j = 0; j < countEls.length; j++) {
        var key = countEls[j].getAttribute('data-count');
        var n = counts[key] || 0;
        countEls[j].textContent = n;
        countEls[j].hidden = (key !== 'discover' && key !== 'installed') && n === 0;
      }

      var running = runningList();
      var pill = document.getElementById('running-pill');
      if (pill) {
        pill.hidden = running.length === 0;
        if (running.length) {
          var rpName = pill.querySelector('.name');
          if (rpName) rpName.textContent = running[0].name || running[0].id;
          pill.title = 'Running: ' + (running[0].name || running[0].id);
          pill.setAttribute('aria-label', 'Running: ' + (running[0].name || running[0].id) + '. Open Running section.');
        }
      }

      var clearBtn = document.getElementById('clear-filters');
      clearBtn.hidden = !(query || selectedTag || favOnly);
      var sortEl = document.getElementById('sort-mode');
      if (sortEl) sortEl.value = sortMode;
      var favEl = document.getElementById('fav-toggle');
      if (favEl) {
        favEl.classList.toggle('active', favOnly);
        favEl.setAttribute('aria-pressed', favOnly ? 'true' : 'false');
        favEl.textContent = 'Favorites';
      }
      var updateAll = document.getElementById('update-all-btn');
      if (updateAll) {
        var updateCount = counts.updates || 0;
        updateAll.hidden = !(section === 'updates' && updateCount > 0);
        updateAll.textContent = 'Update all (' + updateCount + ')';
      }
    }

    function updateLayoutToggle() {
      var btns = document.querySelectorAll('#layout-toggle button');
      for (var i = 0; i < btns.length; i++) {
        var active = btns[i].getAttribute('data-layout') === layout;
        btns[i].classList.toggle('active', active);
        btns[i].setAttribute('aria-pressed', active ? 'true' : 'false');
      }
    }

    function makeIcon(app, small) {
      var icon = document.createElement('div');
      icon.className = 'app-icon' + (small ? ' sm' : '');
      var initial = (app.name || '?').charAt(0).toUpperCase();
      if (app.icon && typeof app.icon === 'string' && app.icon.length) {
        icon.className = 'app-icon plain' + (small ? ' sm' : '');
        var img = document.createElement('img');
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.onerror = function () {
          try { icon.removeChild(img); } catch (e) {}
          icon.className = 'app-icon' + (small ? ' sm' : '');
          icon.textContent = initial;
        };
        img.src = app.icon;
        icon.appendChild(img);
      } else {
        icon.textContent = initial;
      }
      return icon;
    }

    function iconSvg(name) {
      if (name === 'external') {
        return '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
      }
      if (name === 'star') {
        return '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9L12 3.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
      }
      if (name === 'star-filled') {
        return '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9L12 3.5z"/></svg>';
      }
      if (name === 'more') {
        return '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></svg>';
      }
      if (name === 'close') {
        return '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
      }
      return '';
    }

    function makeTitle(app) {
      var row = document.createElement('div');
      row.className = 'app-title-row';
      var name = document.createElement('div');
      name.className = 'app-name';
      name.textContent = app.name || app.id;
      name.setAttribute('role', 'button');
      name.tabIndex = 0;
      name.title = 'View details';
      name.addEventListener('click', function (ev) { ev.stopPropagation(); openAppDrawer(app.id); });
      name.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openAppDrawer(app.id); }
      });
      row.appendChild(name);
      row.appendChild(makeFavButton(app));
      if (app.homepage) {
        var link = document.createElement('button');
        link.type = 'button';
        link.className = 'btn icon-link';
        link.innerHTML = iconSvg('external');
        link.title = 'Open homepage';
        link.setAttribute('aria-label', 'Open ' + (app.name || app.id) + ' homepage');
        link.addEventListener('click', function (ev) {
          ev.stopPropagation();
          if (window.lifecycle && window.lifecycle.openExternal) window.lifecycle.openExternal(app.homepage);
        });
        row.appendChild(link);
      }
      return row;
    }

    function makeFavButton(app) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn icon-link fav-btn' + (isFav(app.id) ? ' on' : '');
      b.innerHTML = isFav(app.id) ? iconSvg('star-filled') : iconSvg('star');
      b.title = isFav(app.id) ? 'Remove from favorites' : 'Add to favorites';
      b.setAttribute('aria-label', b.title);
      b.addEventListener('click', function (ev) { ev.stopPropagation(); toggleFav(app.id); });
      return b;
    }

    function makeLocalPill() {
      var p = document.createElement('span');
      p.className = 'pill local';
      p.textContent = 'Local';
      p.title = 'Installed from a local bundle (not from the catalog)';
      return p;
    }

    function installBlockedReason(app) {
      if (app.incompatible) return 'Requires a newer version of ShinyApps' + (app.minShellVersion ? ' (' + app.minShellVersion + ')' : '');
      if (app.available === false) return 'Not published for this platform';
      return '';
    }

    function makeStatusPill(app, compact) {
      var pill = document.createElement('span');
      pill.className = 'pill';
      if (app.state === 'installing' && app.op) {
        pill.className += ' busy';
        pill.textContent = opVerb(app.op) + '\u2026';
        return pill;
      }
      if (app.state === 'queued') { pill.className += ' unavailable'; pill.textContent = 'Queued'; return pill; }
      if (app.running) { pill.className += ' running'; pill.textContent = 'Running'; return pill; }
      if (!app.installed) {
        var reason = installBlockedReason(app);
        if (reason) {
          pill.className += app.incompatible ? ' incompatible' : ' unavailable';
          pill.textContent = app.incompatible ? 'Incompatible' : 'Unavailable';
          return pill;
        }
        pill.className += ' notinstalled';
        pill.textContent = compact
          ? 'Not installed'
          : 'Not installed' + (app.catalogVersion ? ' \u00b7 v' + app.catalogVersion : '');
        return pill;
      }
      if (app.updateAvailable && app.catalogVersion) {
        pill.className += ' update';
        pill.textContent = compact
          ? 'Update'
          : 'Update ' + (app.installedVersion || '?') + ' \u2192 ' + app.catalogVersion;
        return pill;
      }
      pill.className += ' installed';
      pill.textContent = compact
        ? 'Installed'
        : 'Installed' + (app.installedVersion ? ' \u00b7 v' + app.installedVersion : '');
      return pill;
    }

    function rowVersion(app) {
      if (app.updateAvailable && app.installedVersion && app.catalogVersion) {
        return 'v' + app.installedVersion + ' \u2192 v' + app.catalogVersion;
      }
      if (app.installedVersion) return 'v' + app.installedVersion;
      if (app.catalogVersion) return 'v' + app.catalogVersion;
      return '\u2014';
    }

    function formatSize(bytes) {
      if (!bytes || bytes <= 0) return '';
      var mb = bytes / (1024 * 1024);
      if (mb >= 1024) return (mb / 1024).toFixed(1) + ' GB';
      if (mb >= 10) return Math.round(mb) + ' MB';
      return mb.toFixed(1) + ' MB';
    }

    function makeMeta(app) {
      var parts = [];
      var sz = formatSize(app.size);
      if (sz) parts.push(sz);
      if (app.license) {
        var lic = String(app.license);
        parts.push(lic.length > 24 ? lic.slice(0, 23) + '\u2026' : lic);
      }
      if (app.rVersion) parts.push('R \u2265 ' + app.rVersion);
      if (app.author) parts.push(app.author);
      if (!parts.length) return null;
      var d = document.createElement('div');
      d.className = 'app-meta';
      d.textContent = parts.join('  \u00b7  ');
      d.title = [app.license || '', app.rVersion ? 'Requires R ' + app.rVersion : '', app.author || ''].filter(Boolean).join(' \u00b7 ');
      return d;
    }

    function makeTagChips(app, limit) {
      var tags = Array.isArray(app.tags) ? app.tags.slice(0, limit || 2) : [];
      if (!tags.length) return null;
      var row = document.createElement('div');
      row.className = 'tag-chips';
      tags.forEach(function (t) {
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'tag-chip';
        chip.textContent = t;
        chip.title = 'Show ' + t + ' apps';
        chip.addEventListener('click', function (ev) {
          ev.stopPropagation();
          selectedTag = t;
          section = 'discover';
          sectionTouched = true;
          query = '';
          var searchEl = document.getElementById('search');
          if (searchEl) searchEl.value = '';
          closeAppDrawer();
          resetPaging();
          render();
        });
        row.appendChild(chip);
      });
      return row;
    }

    function appendStatus(container, app) {
      if (app.state === 'installing') {
        var prog = document.createElement('div');
        prog.className = 'progress';
        var bar = document.createElement('i');
        bar.style.width = (app.percent || 0) + '%';
        prog.appendChild(bar);
        container.appendChild(prog);
        var st = document.createElement('div');
        st.className = 'status';
        st.textContent = app.step ? ((app.step === 'unpacking' && app.statusText) ? app.statusText : stepLabel(app.step, app.statusText)) : (opVerb(app.op) + '\u2026');
        container.appendChild(st);
      }
      if ((app.state === 'installing' || app.state === 'queued') && window.lifecycle && window.lifecycle.cancelInstall) {
        var cancel = document.createElement('button');
        cancel.type = 'button';
        cancel.className = 'link-btn';
        cancel.textContent = app.state === 'queued' ? 'Remove from queue' : 'Cancel';
        cancel.addEventListener('click', function (ev) {
          ev.stopPropagation();
          window.lifecycle.cancelInstall(app.taskId);
        });
        container.appendChild(cancel);
      }
      var err = errors[app.id];
      if (err) {
        var se = document.createElement('div');
        se.className = 'status error';
        se.textContent = 'Failed to ' + opAction(err.op) + (err.step ? ' at step "' + err.step + '"' : '') + ': ' + err.message + ' ';
        var dis = document.createElement('button');
        dis.type = 'button';
        dis.className = 'link-btn';
        dis.textContent = 'Dismiss';
        dis.addEventListener('click', function (ev) { ev.stopPropagation(); delete errors[app.id]; render(); });
        se.appendChild(dis);
        container.appendChild(se);
      }
    }

    function makeOverflowButton(app) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn icon';
      b.innerHTML = iconSvg('more');
      b.title = 'More actions';
      b.setAttribute('aria-label', 'More actions');
      // Only this app's own in-flight task freezes its menu. Other installs
      // run in the background and must not block the whole store.
      b.disabled = app.state === 'installing' || app.state === 'queued';
      b.addEventListener('click', function (ev) {
        ev.stopPropagation();
        openPopmenu(b, overflowItems(app));
      });
      return b;
    }

    function copyDownloadLink(appId, mirror) {
      if (!window.lifecycle || !window.lifecycle.copyDownloadLink) {
        showToast('Could not copy the download link', 'error');
        return;
      }
      window.lifecycle.copyDownloadLink(appId, !!mirror).then(function (r) {
        if (r && r.ok) showToast(mirror ? 'Mirror link copied' : 'Download link copied', 'success');
        else showToast((r && r.error) || 'Could not copy the download link', 'error');
      }).catch(function () { showToast('Could not copy the download link', 'error'); });
    }

    function overflowItems(app) {
      var items = [];
      items.push({ label: 'View details', onClick: function () { openAppDrawer(app.id); } });
      if (app.homepage) {
        items.push({
          label: 'Visit website',
          onClick: function () { if (window.lifecycle.openExternal) window.lifecycle.openExternal(app.homepage); }
        });
      }
      if (app.hasDownloadLink) {
        var label = app.downloadLinkKind === 'source'
          ? 'Copy download link'
          : 'Copy download link (' + (app.downloadPlatformLabel || 'this platform') + ')';
        items.push({ label: label, onClick: function () { copyDownloadLink(app.id, false); } });
        if (app.hasMirrorLink) {
          items.push({ label: 'Copy mirror link', onClick: function () { copyDownloadLink(app.id, true); } });
        }
      }
      if (app.installed) {
        items.push({ label: 'Open app folder', onClick: function () {
          if (window.lifecycle && window.lifecycle.openAppFolder) {
            window.lifecycle.openAppFolder(app.id).then(function (ok) {
              if (!ok) showToast('Could not open the app folder', 'error');
            }).catch(function () { showToast('Could not open the app folder', 'error'); });
          }
        } });
        items.push({ label: 'View log', onClick: function () { if (window.lifecycle && window.lifecycle.openAppLog) window.lifecycle.openAppLog(app.id); } });
        items.push({ label: 'Copy diagnostics', onClick: function () {
          if (window.lifecycle && window.lifecycle.copyDiagnostics) {
            window.lifecycle.copyDiagnostics(app.id).then(function (ok) {
              showToast(ok ? 'Diagnostics copied to clipboard' : 'Could not copy diagnostics', ok ? 'success' : 'error');
            }).catch(function () { showToast('Could not copy diagnostics', 'error'); });
          }
        } });
        items.push({ separator: true });
        items.push({ label: 'Uninstall', danger: true, onClick: function () { confirmUninstall(app); } });
      }
      return items;
    }

    function makeActions(app) {
      var actions = document.createElement('div');
      actions.className = 'card-actions';
      if (!window.lifecycle) return actions;
      // Only this app's own task disables its actions; background installs of
      // other apps no longer freeze the store. While one app runs, every other
      // app's Run button is disabled: only one app may run at a time.
      var ownBusy = app.state === 'installing' || app.state === 'queued';
      var anyRunning = model.some(function (a) { return a.running; });
      if (!app.installed) {
        var reason = installBlockedReason(app);
        var installBtn = makeButton('Install', 'primary', function () {
          var go = function () { window.lifecycle.installApp(app.id); };
          if (diskFree != null && app.size && diskFree < app.size * 3) {
            showConfirm({
              title: 'Low disk space',
              message: 'This app needs about ' + (formatSize(app.size * 3) || '?') + ' free, but only ' + (formatSize(diskFree) || '?') + ' is available. Install anyway?',
              confirmLabel: 'Install anyway',
              danger: true,
              onConfirm: go
            });
          } else { go(); }
        }, ownBusy || !!reason || offline);
        if (reason) {
          installBtn.disabled = true;
          installBtn.title = reason;
        } else if (offline) {
          installBtn.title = 'An internet connection is required to install';
        }
        actions.appendChild(installBtn);
        // Not installed, but there may still be a bundle link to copy (or a
        // homepage to visit).
        if (app.hasDownloadLink || app.homepage) actions.appendChild(makeOverflowButton(app));
      } else if (app.running) {
        actions.appendChild(makeButton('Open', 'primary', function () {
          markRecent(app.id);
          window.lifecycle.openApp(app.id);
        }));
        actions.appendChild(makeButton('Stop', '', function () {
          window.lifecycle.stopApp(app.id);
        }));
        actions.appendChild(makeOverflowButton(app));
      } else {
        var runBtn = makeButton('Run', 'primary', function () {
          markRecent(app.id);
          window.lifecycle.runApp(app.id);
        }, ownBusy || anyRunning);
        if (anyRunning) runBtn.title = 'Stop the running app before starting another one';
        actions.appendChild(runBtn);
        if (app.updateAvailable) {
          var updateBtn = makeButton('Update', '', function () {
            window.lifecycle.updateApp(app.id);
          }, ownBusy || offline);
          if (offline) updateBtn.title = 'An internet connection is required to update';
          actions.appendChild(updateBtn);
        }
        actions.appendChild(makeOverflowButton(app));
      }
      return actions;
    }

    function buildCard(app) {
      var card = document.createElement('div');
      card.className = 'app-card';
      card.setAttribute('data-app-id', app.id);
      card.appendChild(makeIcon(app, false));
      card.appendChild(makeTitle(app));
      if (app.description) {
        var desc = document.createElement('div');
        desc.className = 'app-desc';
        desc.textContent = app.description;
        card.appendChild(desc);
      }
      var meta = makeMeta(app);
      if (meta) card.appendChild(meta);
      var tags = makeTagChips(app);
      if (tags) card.appendChild(tags);
      card.appendChild(makeStatusPill(app));
      if (app.local) card.appendChild(makeLocalPill());
      appendStatus(card, app);
      card.appendChild(makeActions(app));
      return card;
    }

    function buildRow(app) {
      var row = document.createElement('div');
      row.className = 'app-row';
      row.setAttribute('data-app-id', app.id);
      row.appendChild(makeIcon(app, true));

      var main = document.createElement('div');
      main.className = 'app-row-main';
      main.appendChild(makeTitle(app));
      var subText = app.description || app.author || '';
      if (subText) {
        var sub = document.createElement('div');
        sub.className = 'app-desc';
        sub.textContent = subText;
        main.appendChild(sub);
      }
      appendStatus(main, app);
      row.appendChild(main);

      var statusCell = document.createElement('div');
      statusCell.className = 'row-cell row-status';
      statusCell.appendChild(makeStatusPill(app, true));
      if (app.local) statusCell.appendChild(makeLocalPill());
      row.appendChild(statusCell);

      var versionCell = document.createElement('div');
      versionCell.className = 'row-cell row-version';
      versionCell.textContent = rowVersion(app);
      row.appendChild(versionCell);

      var sizeCell = document.createElement('div');
      sizeCell.className = 'row-cell row-size';
      sizeCell.textContent = formatSize(app.size) || '—';
      row.appendChild(sizeCell);

      row.appendChild(makeActions(app));
      return row;
    }

    function buildListHeader() {
      var h = document.createElement('div');
      h.className = 'list-header';
      [['', ''], ['', 'App'], ['', 'Status'], ['h-version', 'Version'], ['h-size', 'Size'], ['h-actions', 'Actions']].forEach(function (col) {
        var s = document.createElement('span');
        if (col[0]) s.className = col[0];
        s.textContent = col[1];
        h.appendChild(s);
      });
      return h;
    }

    function skeletonCard() {
      var c = document.createElement('div');
      c.className = 'app-card';
      c.innerHTML = '<div class="sk sk-icon"></div><div class="sk sk-line w60"></div><div class="sk sk-line"></div><div class="sk sk-line w80"></div>';
      return c;
    }
    function skeletonRow() {
      var r = document.createElement('div');
      r.className = 'app-row';
      r.innerHTML = '<div class="sk sk-icon sm"></div><div class="app-row-main"><div class="sk sk-line w40"></div><div class="sk sk-line w70"></div></div>';
      return r;
    }

    function render() {
      updateChrome();
      updateLayoutToggle();
      rebuildSideTags();
      var loadMoreWrap = document.getElementById('load-more-wrap');
      if (loadMoreWrap) loadMoreWrap.hidden = true;
      var container = document.getElementById('apps-grid');
      container.innerHTML = '';
      container.className = 'apps-grid' + (layout === 'list' ? ' list-view' : '');
      var empty = document.getElementById('empty-state');
      empty.innerHTML = '';
      var banner = document.getElementById('banner');
      banner.hidden = !(offline || (loadError && model.length > 0));
      banner.textContent = '';
      if (offline) {
        banner.textContent = 'Offline \u2014 showing installed apps. Install and update are unavailable. ';
        banner.appendChild(makeButton('Retry', '', function () { refresh(); }));
      } else if (!banner.hidden) {
        banner.textContent = 'Could not refresh the catalog \u2014 showing the last known list. ';
        banner.appendChild(makeButton('Retry', '', function () { refresh(); }));
      }
      // A compact, non-blocking summary. Downloads never freeze the store:
      // per-app progress and Cancel live on the Installing section/cards.
      var busybar = document.getElementById('busybar');
      var activeInstalls = installingList();
      var busy = bundleBusy || activeInstalls.length > 0;
      busybar.hidden = !busy;
      busybar.innerHTML = '';
      if (busy) {
        var btext = document.createElement('span');
        btext.style.flex = '1';
        if (bundleBusy) {
          btext.textContent = 'Installing a local bundle \u2014 ' + (bundleStatus || 'working\u2026');
        } else if (activeInstalls.length === 1) {
          var ba = activeInstalls[0];
          btext.textContent = opVerb(ba.op) + ' ' + (ba.name || 'an app') +
            ' \u2014 ' + (ba.statusText || 'working\u2026') + ' (you can keep using the store)';
        } else {
          btext.textContent = activeInstalls.length + ' installs in progress \u2014 you can keep browsing and running apps.';
        }
        busybar.appendChild(btext);
        if (bundleBusy && bundlePercent > 0) {
          var bp = document.createElement('div');
          bp.className = 'progress';
          bp.style.flex = '0 0 160px';
          bp.style.marginTop = '0';
          var bi = document.createElement('i');
          bi.style.width = bundlePercent + '%';
          bp.appendChild(bi);
          busybar.appendChild(bp);
        }
        busybar.appendChild(makeButton('View', '', function () { setSection('installing'); }));
      }

      if (loading && model.length === 0) {
        empty.hidden = true;
        var n = layout === 'list' ? 4 : 6;
        for (var s = 0; s < n; s++) container.appendChild(layout === 'list' ? skeletonRow() : skeletonCard());
        return;
      }
      if (loadError && model.length === 0) {
        empty.hidden = false;
        empty.textContent = 'Could not load the app catalog.';
        var d = document.createElement('div');
        d.className = 'status';
        d.textContent = loadError;
        empty.appendChild(d);
        empty.appendChild(makeButton('Retry', '', function () { refresh(); }));
        return;
      }
      var fullList = currentList();
      var limit = pageSize();
      if (visibleCount < limit) visibleCount = limit;
      var list = fullList.slice(0, visibleCount);
      var countText = fullList.length + (fullList.length === 1 ? ' app' : ' apps');
      if (list.length < fullList.length) countText += ' · showing ' + list.length;
      document.getElementById('result-count').textContent = countText;
      if (list.length === 0) {
        empty.hidden = false;
        empty.textContent = emptyMessage();
        if (query || selectedTag || favOnly) {
          empty.appendChild(makeButton('Clear filters', '', clearAllFilters));
        } else if (section === 'installed' || section === 'updates' || section === 'running') {
          empty.appendChild(makeButton('Browse Discover', 'primary', function () { setSection('discover'); }));
        } else if (offline) {
          empty.appendChild(makeButton('Retry', '', function () { refresh(); }));
        }
      } else {
        empty.hidden = true;
      }
      if (layout === 'list' && list.length > 0) container.appendChild(buildListHeader());
      list.forEach(function (app) {
        container.appendChild(layout === 'list' ? buildRow(app) : buildCard(app));
      });
      if (loadMoreWrap && list.length < fullList.length) {
        loadMoreWrap.hidden = false;
        var moreBtn = document.getElementById('load-more-btn');
        if (moreBtn) moreBtn.textContent = 'Show more (' + (fullList.length - list.length) + ' remaining)';
      }
    }

    function clearAllFilters() {
      query = '';
      selectedTag = '';
      favOnly = false;
      var s = document.getElementById('search');
      if (s) s.value = '';
      resetPaging();
      render();
    }

    function setSection(next) {
      if (['discover', 'installed', 'updates', 'running', 'installing'].indexOf(next) === -1) return;
      if (next === section && !query) return;
      if (next !== section) {
        section = next;
        try { localStorage.setItem('shinyapps.section', section); } catch (e) {}
      }
      sectionTouched = true;
      // Navigating away from a global search returns to the section.
      query = '';
      var searchEl = document.getElementById('search');
      if (searchEl) searchEl.value = '';
      resetPaging();
      try { window.scrollTo(0, 0); } catch (e) {}
      render();
    }

    function setLayout(next) {
      if (next !== 'card' && next !== 'list') return;
      layout = next;
      try { localStorage.setItem('shinyapps.layout', layout); } catch (e) {}
      resetPaging();
      render();
    }

    function makeTagButton(label, value, count) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tag-btn' + (selectedTag === value ? ' active' : '');
      b.setAttribute('aria-pressed', selectedTag === value ? 'true' : 'false');
      var l = document.createElement('span');
      l.textContent = label;
      var c = document.createElement('span');

    function drawerEsc(ev) {
      if (ev.key === 'Escape') { closeAppDrawer(); return; }

      var f = drawer.querySelectorAll('button, a[href], input, select, textarea, [tabindex="0"]');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
      else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
    }

    function closeAppDrawer() {
      var overlay = document.getElementById('drawer-overlay');
      var drawer = document.getElementById('app-drawer');
      if (!overlay || overlay.hidden) return;
      overlay.hidden = true;

      document.body.style.overflow = '';

      if (drawerLastFocus && typeof drawerLastFocus.focus === 'function') {

    // --- Overflow popup menu ------------------------------------------------
    function docClosePopmenu(ev) {
      var m = document.getElementById('popmenu');
      if (m && !m.contains(ev.target)) closePopmenu();
    }
    function escClosePopmenu(ev) { if (ev.key === 'Escape') closePopmenu(); }
    function menuKeyNav(ev) {
      var m = document.getElementById('popmenu');
      if (!m) return;
      var items = Array.prototype.slice.call(m.querySelectorAll('.popmenu-item'));
      if (!items.length) return;
      var idx = items.indexOf(document.activeElement);
      if (ev.key === 'ArrowDown') { ev.preventDefault(); items[(idx + 1) % items.length].focus(); }
      else if (ev.key === 'ArrowUp') { ev.preventDefault(); items[(idx - 1 + items.length) % items.length].focus(); }
    }
    function closePopmenu() {
      var m = document.getElementById('popmenu');
      var anchor = m && m.__anchor;
      if (m) m.remove();
      document.removeEventListener('click', docClosePopmenu, true);
      document.removeEventListener('keydown', escClosePopmenu);
      document.removeEventListener('keydown', menuKeyNav);
      window.removeEventListener('resize', closePopmenu);
      window.removeEventListener('scroll', closePopmenu, true);
      if (anchor && anchor.focus) anchor.focus();
    }
    function openPopmenu(anchor, items) {
      closePopmenu();
      var menu = document.createElement('div');
      menu.className = 'popmenu';
      menu.id = 'popmenu';
      menu.setAttribute('role', 'menu');
      menu.__anchor = anchor;
      items.forEach(function (it) {
        if (it.separator) {
          var sepel = document.createElement('div');
          sepel.className = 'popmenu-sep';
          menu.appendChild(sepel);
          return;
        }
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'popmenu-item' + (it.danger ? ' danger' : '');
        b.textContent = it.label;
        b.setAttribute('role', 'menuitem');
        b.addEventListener('click', function (ev) { ev.stopPropagation(); closePopmenu(); it.onClick(); });
        menu.appendChild(b);
      });
      document.body.appendChild(menu);
      var rect = anchor.getBoundingClientRect();
      var w = menu.offsetWidth || 160;
      var h = menu.offsetHeight || 0;
      var left = Math.min(rect.right - w, window.innerWidth - w - 8);
      if (left < 8) left = 8;
      var top = rect.bottom + 6;
      if (top + h > window.innerHeight - 8) top = Math.max(8, rect.top - h - 6);
      menu.style.left = left + 'px';
      menu.style.top = top + 'px';
      var first = menu.querySelector('.popmenu-item');
      if (first) first.focus();
      setTimeout(function () {
        document.addEventListener('click', docClosePopmenu, true);
        document.addEventListener('keydown', escClosePopmenu);
        document.addEventListener('keydown', menuKeyNav);
        window.addEventListener('resize', closePopmenu);
        window.addEventListener('scroll', closePopmenu, true);
      }, 0);
    }

    // --- Storage report (used inside Settings) ------------------------------
    var usageProgressEls = null;
    function showUsageProgress(body, label) {
      body.innerHTML = '';
      var st = document.createElement('div');
      st.className = 'dialog-msg';
      st.textContent = label || 'Loading\u2026';
      var wrap = document.createElement('div');
      wrap.className = 'progress indeterminate';

      wrap.appendChild(bar);
      body.appendChild(st);
      body.appendChild(wrap);
      usageProgressEls = { status: st, bar: bar, wrap: wrap };
    }
    function updateUsageProgress(done, total, label) {
      if (!usageProgressEls) return;
      if (label) usageProgressEls.status.textContent = label;
      if (total && total > 0) {
        usageProgressEls.wrap.classList.remove('indeterminate');
        usageProgressEls.bar.style.width = Math.max(4, Math.round((done / total) * 100)) + '%';
      } else {
        usageProgressEls.wrap.classList.add('indeterminate');
      }
    }
    async function renderStorage(body) {
      showUsageProgress(body, 'Loading\u2026');
      var u = null;
      try { u = await window.lifecycle.getUsage(); } catch (e) {}
      usageProgressEls = null;
      body.innerHTML = '';
      if (!u) { body.textContent = 'Could not read storage info.'; return; }
      function addLine(label, value, muted) {
        var row = document.createElement('div');
        row.className = 'storage-row';
        var l = document.createElement('span');
        l.textContent = label;
        if (muted) l.className = 'storage-muted';
        var v = document.createElement('span');
        v.textContent = value;
        row.appendChild(l); row.appendChild(v); body.appendChild(row);
      }
      var f = formatSize;
      addLine('Installed apps', f(u.appsTotal) || '0 MB');
      addLine('Shared packages', f(u.sharedTotal) || '0 MB');
      if (u.privateTotal) addLine('Private packages', f(u.privateTotal) || '0 MB');
      addLine('Download cache', (f(u.cacheBytes) || '0 MB') + (u.cacheFiles ? '  (' + u.cacheFiles + ' file' + (u.cacheFiles > 1 ? 's' : '') + ')' : ''));
      if (u.staleDirs) addLine('Incomplete', (f(u.staleBytes) || '0 MB') + '  (' + u.staleDirs + ')');
      if (u.diskFree != null) addLine('Free disk', f(u.diskFree) || '');
      var s1 = document.createElement('div'); s1.className = 'storage-section'; s1.textContent = 'Apps'; body.appendChild(s1);
      (u.apps || []).forEach(function (a) { addLine(a.id + (a.version ? '  v' + a.version : ''), f(a.bytes) || '0 MB', true); });
      if (u.shared && u.shared.length) {
        var s2 = document.createElement('div'); s2.className = 'storage-section'; s2.textContent = 'Shared packages'; body.appendChild(s2);
        (u.shared || []).forEach(function (s) { addLine(s.name + '  (' + s.refs + ' app' + (s.refs === 1 ? '' : 's') + ')', f(s.bytes) || '0 MB', true); });
      }
    }
