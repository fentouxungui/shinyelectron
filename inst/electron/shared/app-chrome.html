<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>{{app_name}}</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: {{brand_background}};
      --surface: color-mix(in srgb, var(--canvas) 35%, #ffffff 65%);
      --surface-2: color-mix(in srgb, var(--canvas) 62%, #ffffff 38%);
      --ink: #0B1626;
      --ink-2: #33455F;
      --muted: #5B7089;
      --line: color-mix(in srgb, var(--ink) 13%, transparent);
      --line-strong: color-mix(in srgb, var(--ink) 23%, transparent);
      /* Brand blue, deepened just enough for accent text to clear AA on paper. */
      --accent: color-mix(in srgb, {{brand_primary}} 88%, #0B1626);
      --accent-soft: color-mix(in srgb, var(--accent) 13%, var(--surface));
      --ok: #1c7147;
      --warn: #8a5300;
      --danger: #b42318;
      --font-ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --canvas: #0B1626;
      --surface: #0F1D31;
      --surface-2: #142641;
      --ink: #EAF2FF;
      --ink-2: #C7DAF2;
      --muted: #8FB0D8;
      --line: color-mix(in srgb, var(--ink) 13%, transparent);
      --line-strong: color-mix(in srgb, var(--ink) 24%, transparent);
      --accent: color-mix(in srgb, {{brand_primary}} 62%, #ffffff);
      --accent-soft: color-mix(in srgb, var(--accent) 17%, var(--surface));
      --ok: #6fd39b;
      --warn: #f0bd6b;
      --danger: #ff9a91;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-ui);
      font-size: 13px;
      background: var(--canvas);
      color: var(--ink);
      -webkit-app-region: drag;
      user-select: none;
    }
    .bar {
      position: relative; height: 44px;
      display: flex; align-items: center; gap: 9px;
      padding: 0 12px;
      border-bottom: 1px solid var(--line);
    }
    .dot {
      flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%;
      background: var(--warn);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 16%, transparent);
    }
    .bar[data-state="running"] .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 16%, transparent); }
    .bar[data-state="error"] .dot { background: var(--danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 16%, transparent); }
    .bar[data-state="stopped"] .dot { background: var(--muted); box-shadow: none; }
    .name {
      max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 13px; font-weight: 650; letter-spacing: -.01em;
    }
    .status {
      max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--muted); font-size: 12px;
    }
    .spacer { flex: 1 1 auto; }
    .btn {
      -webkit-app-region: no-drag;
      min-height: 28px; padding: 4px 11px;
      border: 1px solid var(--line-strong); border-radius: 7px;
      background: var(--surface); color: var(--ink);
      font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
      transition: background .12s ease, border-color .12s ease, color .12s ease;
    }
    .btn:hover { background: var(--surface-2); border-color: color-mix(in srgb, var(--ink) 30%, transparent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
    .btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 36%, var(--line)); background: transparent; }
    .btn.danger:hover { background: color-mix(in srgb, var(--danger) 10%, var(--surface)); border-color: var(--danger); }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
    .progress {
      position: absolute; left: 0; right: 0; bottom: -1px; height: 3px;
      background: var(--surface-2); overflow: hidden;
    }
    .progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s ease; }
    .progress.indeterminate > i { width: 30%; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }
  </style>
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search).get('theme') || 'system';
        var eff = q === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : q;
        document.documentElement.setAttribute('data-theme', eff === 'dark' ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="bar" id="bar" data-state="starting">
    <span class="dot" aria-hidden="true"></span>
    <span class="name" id="name">App</span>
    <span class="status" id="status">Starting…</span>
    <span class="spacer"></span>
    <button id="store" class="btn" type="button">Store</button>
    <button id="stop" class="btn danger" type="button">Stop</button>
    <div class="progress indeterminate" id="progress"><i id="progress-bar"></i></div>
  </div>
  <script>
    (function () {
      var appId = '';
      var bar = document.getElementById('bar');
      var nameEl = document.getElementById('name');
      var statusEl = document.getElementById('status');
      var progress = document.getElementById('progress');
      var progressBar = document.getElementById('progress-bar');
      var storeBtn = document.getElementById('store');
      var stopBtn = document.getElementById('stop');
      if (!window.appChrome) {
        statusEl.textContent = 'Toolbar unavailable';
        return;
      }
      window.appChrome.info().then(function (info) {
        if (!info) return;
        appId = info.appId || '';
        if (info.name) nameEl.textContent = info.name;
      }).catch(function () {});
      window.appChrome.onStatus(function (s) {
        if (!s) return;
        bar.setAttribute('data-state', s.state || 'starting');
        statusEl.textContent = s.message || s.state || '';
        stopBtn.disabled = s.state === 'stopping' || s.state === 'stopped';
        if (typeof s.percent === 'number' && s.percent >= 0 && s.state === 'starting') {
          progress.hidden = false;
          progress.classList.remove('indeterminate');
          progressBar.style.width = Math.max(4, Math.min(100, s.percent)) + '%';
        } else if (s.state === 'starting') {
          progress.hidden = false;
          progress.classList.add('indeterminate');
          progressBar.style.width = '';
        } else {
          progress.hidden = true;
          progress.classList.remove('indeterminate');
          progressBar.style.width = '0%';
        }
      });
      storeBtn.addEventListener('click', function () { window.appChrome.store(); });
      stopBtn.addEventListener('click', function () {
        if (appId) window.appChrome.stop(appId);
      });
    })();
  </script>
</body>
</html>
